<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light">
	<title>Protected file · WebFP Drive</title>
	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: #f3f6fb;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}
		* { box-sizing: border-box; }
		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			place-items: center;
			background:
				radial-gradient(ellipse at 50% 0, rgba(88, 125, 255, .12), transparent 55%),
				#f3f6fb;
		}
		.page { width: min(100%, 420px); }
		.brand {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			margin-bottom: 28px;
			color: #27334b;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: -.02em;
		}
		.brand-mark {
			display: grid;
			width: 32px;
			height: 32px;
			border-radius: 10px;
			place-items: center;
			color: #fff;
			background: #536dfe;
			box-shadow: 0 4px 10px rgba(83, 109, 254, .25);
		}
		.card {
			padding: 36px;
			border: 1px solid #e5eaf2;
			border-radius: 18px;
			background: #fff;
			box-shadow: 0 20px 60px rgba(27, 43, 75, .09);
		}
		.icon {
			display: grid;
			width: 52px;
			height: 52px;
			margin-bottom: 24px;
			border-radius: 15px;
			place-items: center;
			color: #536dfe;
			background: #eef1ff;
		}
		h1 {
			margin: 0;
			color: #172033;
			font-size: clamp(23px, 6vw, 28px);
			font-weight: 700;
			letter-spacing: -.04em;
			line-height: 1.2;
		}
		.description {
			margin: 12px 0 26px;
			color: #65718a;
			font-size: 15px;
			line-height: 1.6;
		}
		.error {
			margin: 0 0 20px;
			padding: 12px 14px;
			border: 1px solid #fecaca;
			border-radius: 10px;
			color: #b42318;
			background: #fff5f4;
			font-size: 14px;
			line-height: 1.5;
		}
		label {
			display: block;
			margin-bottom: 8px;
			color: #344054;
			font-size: 13px;
			font-weight: 650;
		}
		input {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid #d5dce8;
			border-radius: 10px;
			outline: none;
			color: #172033;
			background: #fff;
			font: inherit;
			font-size: 15px;
			transition: border-color .15s ease, box-shadow .15s ease;
		}
		input::placeholder { color: #98a2b3; }
		input:focus {
			border-color: #6378ff;
			box-shadow: 0 0 0 4px rgba(83, 109, 254, .14);
		}
		button {
			display: flex;
			width: 100%;
			height: 48px;
			align-items: center;
			justify-content: center;
			gap: 9px;
			margin-top: 16px;
			border: 0;
			border-radius: 10px;
			color: #fff;
			background: #536dfe;
			box-shadow: 0 4px 9px rgba(83, 109, 254, .2);
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 650;
			transition: background .15s ease, transform .15s ease;
		}
		button:hover { background: #4058e8; }
		button:active { transform: translateY(1px); }
		button:focus-visible {
			outline: 3px solid rgba(83, 109, 254, .35);
			outline-offset: 3px;
		}
		.privacy {
			margin: 22px 0 0;
			color: #8a94a8;
			font-size: 12px;
			line-height: 1.5;
			text-align: center;
		}
		@media (max-width: 480px) {
			body { padding: 20px; }
			.brand { margin-bottom: 22px; }
			.card { padding: 28px 24px; border-radius: 15px; }
		}
	</style>
</head>
<body>
	<main class="page">
		<div class="brand">
			<span class="brand-mark" aria-hidden="true">
				<svg width="19" height="19" viewBox="0 0 24 24" fill="none">
					<path
						d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5v-9Z"
						stroke="currentColor" stroke-width="1.8"/>
					<path
						d="m8 15 2.7-3 2.1 2 1.5-1.5L17 15M8.5 9.5h.01"
						stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
						stroke-linejoin="round"/>
				</svg>
			</span>
			<span>WebFP Drive</span>
		</div>
		<section class="card" aria-labelledby="title">
			<div class="icon" aria-hidden="true">
				<svg width="25" height="25" viewBox="0 0 24 24" fill="none">
					<rect x="5" y="10" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
					<path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
					<circle cx="12" cy="15.5" r="1.2" fill="currentColor"/>
				</svg>
			</div>
			<h1 id="title">This file is protected</h1>
			<p class="description">Enter the password provided by the person who shared this file to access it.</p>
			{{if .Message}}<p class="error" id="password-error" role="alert">{{.Message}}</p>{{end}}
			<form method="post" action="{{.Action}}">
				<label for="password">Password</label>
				<input id="password" name="password" type="password"
					autocomplete="current-password" placeholder="Enter the file password"
					aria-describedby="{{if .Message}}password-error{{end}}" required autofocus>
				<button type="submit">
					<span>Unlock file</span>
					<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</form>
			<p class="privacy">Your password is only used to unlock this shared file.</p>
		</section>
	</main>
</body>
</html>
