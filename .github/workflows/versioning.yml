name: versioning

on:
  push:
    branches: [stable]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
            python-version: '3.13'

      - name: Cache CI tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ci-tools-${{ runner.os }}-swag-v1.8.1-goimports-v0.51.0-golangci-lint-v2.12.2

      - name: Install CI tools
        run: |
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          command -v swag >/dev/null 2>&1 || go install github.com/swaggo/swag/cmd/swag@v1.8.1
          command -v goimports >/dev/null 2>&1 || go install golang.org/x/tools/cmd/goimports@v0.51.0
          command -v golangci-lint >/dev/null 2>&1 || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: generate swagger docs
        run: |
          "$(go env GOPATH)/bin/swag" init -g main.go -d cmd,client/handlers,store -o docs --parseInternal

      - name: pre-commit
        uses: pre-commit/action@v3.0.1

      - name: run go test
        id: test
        run: go test -json ./... -count=1 -coverpkg=./... -coverprofile=coverage.out > test-results.json

      - name: Publish Test Report
        uses: robherley/go-test-action@v1
        if: always()
        with:
          fromJSONFiles: test-results.json

      - name: go build
        run: go build ./...

      - name: Cleanup temporary files
        run: rm -f coverage.out test-results.json

      - name: bump and tag
        id: bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          NEW=v$(echo "$LATEST" | cut -d. -f1 | tr -d v).$(echo "$LATEST" | cut -d. -f2).$(($(echo "$LATEST" | cut -d. -f3)+1))
          git tag "$NEW" && git push --tags
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    env:
      REGION: europe-west1
      REPO: webfp
      IMAGE: webfp-be
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ needs.tag.outputs.version }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/webfp/webfp-be
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: webfp
          location: europe-west1

      - name: Restore env file from cluster
        run: |
          kubectl get secret webfp-be-env -n webfp -o go-template='{{index .data ".env"}}' | base64 -d > .env.gke
          test -s .env.gke

      - name: Rolling deploy to GKE
        run: make deploy-gke

      - name: Keep last 3 images
        run: |
          gcloud artifacts docker images list "$IMAGE" --format='json(version,createTime)' \
            | jq -r 'sort_by(.createTime) | reverse | .[3:] | .[].version' \
            | sed "s|^|$IMAGE@|" \
            | xargs -r gcloud artifacts docker images delete --quiet --delete-tags
