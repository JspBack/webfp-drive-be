apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webfp-be
  namespace: webfp
  labels:
    app: webfp-be
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: webfp-be
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
