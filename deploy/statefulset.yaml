apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webfp-be
  namespace: webfp
  labels:
    app: webfp-be
spec:
  serviceName: webfp-be
  selector:
    matchLabels:
      app: webfp-be
  template:
    metadata:
      labels:
        app: webfp-be
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: be
          image: webfp-be:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: env
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: env
          secret:
            secretName: webfp-be-env
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: webfp-be
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        volumeMode: Filesystem
